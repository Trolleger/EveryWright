<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Everywright</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #16181d;
        --bg: #faf8f4;
        --accent: #2457f5;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --ink: #faf8f4; --bg: #16181d; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .brand { font-weight: 800; margin-bottom: 24px; display: block; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">Everywright</span>
      <h1>Page not found</h1>
      <p>That page doesn't exist. Head back to the home page.</p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
