# Everywright mailer Worker. Deploy from this folder with: npx wrangler deploy

name = "everywright-mailer"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No public URL. Only the Pages site reaches this Worker, through its MAILER service binding.
workers_dev = false

# Email Service binding. The name EMAIL is what src/index.js uses.
# Sending is limited to hello@everywright.com.
[[send_email]]
name = "EMAIL"
destination_address = "hello@everywright.com"
